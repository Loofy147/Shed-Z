name: Documentation and preconfiguration validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation and safe configuration defaults
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate documentation links and source references
        run: python scripts/check_docs.py
      - name: Validate preconfiguration safety gates
        run: python scripts/validate_preconfiguration.py
